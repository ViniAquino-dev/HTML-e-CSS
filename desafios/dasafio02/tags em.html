<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tags HTML</title>
</head>
<body>
    <h1>Tags em HTML</h1>

<p>
Em HTML podemos inserir os elementos da lista a seguir. Passe o cursorsobre os termos para descobrir qual tag deverá utilizar em cada caso.
<ul>
    <li><abbr title="tag p">Parágrafo</abbr></li>
    <li><abbr title="tag h1...h6">Titulo</abbr></li>
    <li><abbr title="tag img">Imagens</abbr></li>
    <li><abbr title="tag abbr">abreviações</abbr></li>
    <li><abbr title="tag code">Códigos-Fontes</abbr></li>
    <li><abbr title="tag ol">Listas numeradas</abbr></li>
    <li><abbr title="tag ul">Listas com demarcadores</abbr></li>
</ul>
</p>


</body>
</html>
